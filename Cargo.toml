[package]
name = "faultkit"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/faultkit"
homepage = "https://santh.dev"
documentation = "https://docs.rs/faultkit"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
description = "Fault injection for testing error paths, fail the Nth syscall and verify graceful handling"
keywords = ["testing", "fault-injection", "resilience", "chaos-engineering", "error-handling"]
categories = ["development-tools::testing"]
[package.metadata.santh]
status = "beta"

[workspace]

[dependencies]

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
proptest = "1.0"
parking_lot = "0.12"

[[bench]]
name = "zero_cost"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
